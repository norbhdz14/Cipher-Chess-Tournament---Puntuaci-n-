name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - uses: actions/checkout@v4

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug || (
            echo "=== EL BUILD FALLÓ. BUSCANDO REGISTROS ==="
            find . -name "*.log" -exec cat {} + || true
            find /github/home/.buildozer -name "*.log" -exec tail -n 200 {} + || true
            exit 1
          )

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CipherChessTournament-APK
          path: bin/*.apk
