name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest

    steps:
      - uses: actions/checkout@v4

      - name: Clean up workspace and old cache
        run: |
          rm -rf .buildozer bin/ .plat ~/.buildozer

      - name: Build with Buildozer
        run: |
          export MAKEFLAGS="-j2"
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CipherChessTournament-APK
          path: bin/*.apk
